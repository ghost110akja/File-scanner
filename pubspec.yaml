name: scanner_app
description: Document scanner, OCR and card reader
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  google_mlkit_document_scanner: ^0.3.0
  google_mlkit_text_recognition: ^0.13.1
  flutter_tesseract_ocr: ^0.4.28
  image_picker: ^1.1.2
  share_plus: ^10.1.0
flutter:
  uses-material-design: true
  assets:
    - assets/tessdata_config.json
    - assets/tessdata/
